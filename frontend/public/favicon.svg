<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer obsidian metallic chassis -->
    <linearGradient id="chassisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#343b52"/>
      <stop offset="18%" stop-color="#1e2333"/>
      <stop offset="82%" stop-color="#111420"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>
    <!-- Inner recessed well -->
    <radialGradient id="wellGrad" cx="50%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#222940"/>
      <stop offset="65%" stop-color="#101422"/>
      <stop offset="100%" stop-color="#070910"/>
    </radialGradient>
    <!-- Top glass sheen -->
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Sculpted 3D titanium-silver V left wing -->
    <linearGradient id="vLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Sculpted 3D anodized sapphire-indigo V right wing -->
    <linearGradient id="vRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="78%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Vertex sapphire jewel glow -->
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer rounded squircle chassis with metallic bevel -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#chassisGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="7" y="7" width="114" height="114" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2"/>

  <!-- Recessed circular vault dial plate -->
  <circle cx="64" cy="64" r="46" fill="url(#wellGrad)" stroke="#05070c" stroke-width="3"/>
  <circle cx="64" cy="64" r="44.5" fill="none" stroke="#64748b" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Subtle vault tick marks -->
  <g stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round">
    <line x1="64" y1="22" x2="64" y2="26"/>
    <line x1="64" y1="102" x2="64" y2="106"/>
    <line x1="22" y1="64" x2="26" y2="64"/>
    <line x1="102" y1="64" x2="106" y2="64"/>
  </g>

  <!-- Ambient sapphire glow behind V vertex -->
  <circle cx="64" cy="86" r="22" fill="url(#gemGlow)"/>

  <!-- Sculpted 3D Beveled 'V' Emblem -->
  <g filter="url(#dropShadow)">
    <!-- Left metallic chamfered arm -->
    <polygon points="30,36 47,36 64,82 64,98 54,98" fill="url(#vLeft)"/>
    <!-- Left arm top specular ridge -->
    <polygon points="30,36 47,36 45,40 34,40" fill="#ffffff" fill-opacity="0.85"/>
    <!-- Left arm inner bevel facet -->
    <polygon points="47,36 64,82 60,84 44,40" fill="#94a3b8" fill-opacity="0.5"/>

    <!-- Right sapphire-metallic chamfered arm -->
    <polygon points="98,36 81,36 64,82 64,98 74,98" fill="url(#vRight)"/>
    <!-- Right arm top specular ridge -->
    <polygon points="98,36 81,36 83,40 94,40" fill="#e0e7ff" fill-opacity="0.8"/>
    <!-- Right arm dark inner shadow edge -->
    <polygon points="81,36 64,82 67,85 83,40" fill="#1e1b4b" fill-opacity="0.45"/>

    <!-- Center vertex faceted crystal highlight -->
    <polygon points="64,78 69,89 64,96 59,89" fill="#38bdf8" fill-opacity="0.85"/>
    <polygon points="64,78 67,86 64,89 61,86" fill="#e0f2fe" fill-opacity="0.9"/>
  </g>

  <!-- Curved glass lens sheen across upper half -->
  <path d="M 14 32 Q 64 56 114 32 L 114 28 Q 114 10 96 10 L 32 10 Q 14 10 14 28 Z" fill="url(#glassSheen)"/>
</svg>
